name: keep-order

on:
  schedule:
    - cron: "30 3 * * SUN"
  workflow_dispatch:

env:
  PACKAGE_OWNER: 'tech1-agency'
  KEEP_COUNT_CONTAINERS: 5
  KEEP_COUNT_MAVEN_PACKAGES: 10
  KEEP_COUNT_RELEASES_AND_TAGS: 10

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - name: "checkout"
        uses: actions/checkout@v4

      # Delete packages - package-type: container

      - name: "delete container package untagged versions [jbst-server-iam]"
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ env.PACKAGE_OWNER }}
          package-name: 'jbst-server-iam'
          package-type: 'container'
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-only-untagged-versions: true

      - name: "delete container package [jbst-server-iam]"
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ env.PACKAGE_OWNER }}
          package-name: 'jbst-server-iam'
          package-type: 'container'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: ${{ env.KEEP_COUNT_CONTAINERS }}

      # TODO [YYL] cleanup jbst-iam package
      # Delete packages - package-type: maven

      - name: "delete maven package [jbst-server-hardware-monitoring]"
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ env.PACKAGE_OWNER }}
          package-name: 'packages.jbst.jbst-server-hardware-monitoring'
          package-type: 'maven'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: ${{ env.KEEP_COUNT_MAVEN_PACKAGES }}

      - name: "delete maven package [jbst-server-iam]"
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ env.PACKAGE_OWNER }}
          package-name: 'packages.jbst.jbst-server-iam'
          package-type: 'maven'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: ${{ env.KEEP_COUNT_MAVEN_PACKAGES }}

      - name: "delete maven package [jbst-server-ops]"
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ env.PACKAGE_OWNER }}
          package-name: 'packages.jbst.jbst-server-ops'
          package-type: 'maven'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-versions-to-keep: ${{ env.KEEP_COUNT_MAVEN_PACKAGES }}

      # Delete releases and tags

      - name: "delete releases and tags"
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: ${{ env.KEEP_COUNT_RELEASES_AND_TAGS }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

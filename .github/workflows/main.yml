#file: noinspection UndefinedAction
name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:

# MAVEN_DEPLOYMENT_ENABLED, DOCKER_VERSION and DOCKER_PUSH_ENABLED live in
# .github/deployment.env (loaded below) so the release scripts never have to
# modify a workflow file — GITHUB_TOKEN cannot push .github/workflows/* changes.
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_SERVER_IAM: yyluchkiv/jbst-server-iam

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: "checkout"
        uses: actions/checkout@v6

      - name: "deployment flags [.github/deployment.env]"
        run: grep -vE '^\s*(#|$)' .github/deployment.env >> "$GITHUB_ENV"

      - name: "java21"
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: "maven [settings]"
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [{
                "id": "github-jbst",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
            }]

      - name: "maven [build]"
        if: env.MAVEN_DEPLOYMENT_ENABLED == 'false'
        run: ./mvnw clean install

      - name: "maven [github packages]"
        if: env.MAVEN_DEPLOYMENT_ENABLED == 'true'
        run: ./mvnw clean -DskipTests -Dmaven.test.skip deploy -Pgithub

      - name: "docker login"
        # if: env.DOCKER_PUSH_ENABLED == 'true'
        if: false
        run: docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: "docker [server-iam]"
        # if: env.DOCKER_PUSH_ENABLED == 'true'
        if: false
        run: |
          cd jbst-server-iam
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_SERVER_IAM }}:${{ env.DOCKER_VERSION }} .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_SERVER_IAM }}:${{ env.DOCKER_VERSION }}


#file: noinspection UndefinedAction
name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MAVEN_DEPLOYMENT_ENABLED: 'true'
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_SERVER_IAM: tech1-agency/jbst-server-iam
  DOCKER_IMAGE_SERVER_OPS: tech1-agency/jbst-server-ops
  DOCKER_VERSION: '1.37'
  DOCKER_PUSH_ENABLED: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - name: "checkout"
        uses: actions/checkout@v4

      - name: "java17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: "maven [settings]"
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{
                "id": "github-jbst",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
            }]

      - name: "maven [build]"
        if: env.MAVEN_DEPLOYMENT_ENABLED == 'false'
        run: mvn clean install

      - name: "maven [github packages]"
        if: env.MAVEN_DEPLOYMENT_ENABLED == 'true'
        run: mvn clean -DskipTests -Dmaven.test.skip deploy -Pgithub

      - name: "docker login"
        if: env.DOCKER_PUSH_ENABLED == 'true'
        run: docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: "docker [server-iam]"
        if: env.DOCKER_PUSH_ENABLED == 'true'
        run: |
          cd jbst-server-iam
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_SERVER_IAM }}:${{ env.DOCKER_VERSION }} .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_SERVER_IAM }}:${{ env.DOCKER_VERSION }}

      - name: "docker [server-ops]"
        if: env.DOCKER_PUSH_ENABLED == 'true'
        run: |
          cd jbst-server-ops
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_SERVER_OPS }}:${{ env.DOCKER_VERSION }} .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE_SERVER_OPS }}:${{ env.DOCKER_VERSION }}

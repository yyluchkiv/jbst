services:
  jbst-server:
    image: ghcr.io/yyluchkiv/jbst-server-iam:1.72-SNAPSHOT
    restart: "no"
    container_name: jbst-server
    networks:
      - network-jbst
    ports:
      - "3002:3002"
    depends_on:
      jbst-database-postgres:
        condition: service_healthy
    links:
      - jbst-database-postgres
    environment:
      - PORT=3002
      - SPRING_BOOT_PROFILE=postgres
      - CONFIG_LOCATIONS=classpath:application.yml,classpath:application-dev.yml,classpath:application-postgres.yml,file:/application-docker-postgres.yml
      - JASYPT_PASSWORD=JJJJBSTGH
      - JVM_ARGUMENTS=-Xmx5g -XX:+UseZGC -XX:+ZGenerational --add-opens=java.base/java.time=ALL-UNNAMED
    volumes:
      - ./application-docker-postgres.yml:/application-docker-postgres.yml

  jbst-database-postgres:
    image: postgres:14.3
    restart: "no"
    container_name: jbst-database-postgres
    ports:
      - "3004:5432"
    networks:
      - network-jbst
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - volume-jbst-postgres:/var/lib/postgresql/data
      - ./init-postgres-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  network-jbst:
    name: network-jbst
    driver: bridge

volumes:
  volume-jbst-postgres:
    name: volume-jbst-postgres

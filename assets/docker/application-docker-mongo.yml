# Logging
logging:
  config: classpath:logback-console.xml

# jbst
jbst:
  app:
    springdoc-enabled: true
    webclient-url: http://localhost:3000
  utils:
    geolocations:
      enabled: false
    countries-flags:
      enabled: false
    users-agents:
      enabled: false
  incidents-manager:
    enabled: false
  emails:
    enabled: false
  mvc:
    cors:
      allowed-origins:
        - http://localhost:3003
        - http://localhost:8686
        - http://localhost:8787
  security:
    cookies:
      domain: localhost
    jwt:
      secret-key: ENC(GbnDNQVCspqW74HYwR6XePbdG6dmo7l/rIPe+hL7uHSnj+5kkUQsj0ZPegUGytLpx/5pdLO7vdQ=)
      storage-method: COOKIES
      access-token:
        expiration:
          amount: 30
          unit: MINUTES # @java.time.temporal.ChronoUnit
      refresh-token:
        expiration:
          amount: 60
          unit: MINUTES # @java.time.temporal.ChronoUnit
    logging:
      advanced-request-logging-enabled: false
    sessions:
      clean-sessions-by-expired-refresh-tokens-cron:
        enabled: true
        expression: "*/30 * * * * *"
        zone-id: "Europe/Kyiv"
      enable-sessions-metadata-renew-cron:
        enabled: true
        expression: "*/30 * * * * *"
        zone-id: "Europe/Kyiv"
    essence:
      users-on-init:
        enabled: true
        users:
          - username: admin11
            password: "$2a$11$qzm4DlVWEssSavOV0Qf0JOzxQZPIlwl8ja5KlQmBn2QtK7G7bSx3C"
            zone-id: "Europe/Kyiv"
            password-change-required: false
            authorities: [ "admin", "invitations:write" ]
          - username: superadmin11
            password: "$2a$11$qzm4DlVWEssSavOV0Qf0JOzxQZPIlwl8ja5KlQmBn2QtK7G7bSx3C"
            zone-id: "Europe/Kyiv"
            password-change-required: false
            authorities: [ "superadmin", "invitations:read", "invitations:write" ]
      invitations-on-init:
        enabled: true
  databases:
    mongo:
      enabled: true
      database:
        host: jbst-database-mongodb
        port: 27017
        name: jbst

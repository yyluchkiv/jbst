<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
<center>
  <table cellpadding="0" cellspacing="0" style="font-family:Gotham, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #444444; width: 550px; padding: 40px; border: 1px #dceaf5 solid; border-radius: 4px">
    <tr>
      <td style="padding-bottom: 30px">Hi Yurii,</td>
    </tr>
    <tr>
      <td style="padding-bottom: 30px">
        A new web browser just signed in to your Dropbox account. To help keep
        your account secure, let us know if this is you.
      </td>
    </tr>
    <tr>
      <td style="padding-bottom: 30px">
        <table style="background:#e8f2fa; border-radius: 4px; color: #444444; padding: 30px; width: 100%">
          <tr>
            <td style="padding-bottom: 20px"><b>Is this you?</b></td>
          </tr>
          <tr>
            <td>
              <table style="padding-bottom: 20px" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right: 40px; vertical-align: top; padding-bottom: 10px">Where:</td>
                  <td style="padding-bottom: 10px"><b th:text="${where}"></b></td>
                </tr>
                <tr>
                  <td style="padding-right: 40px; vertical-align: top; padding-bottom: 10px">When:</td>
                  <td style="padding-bottom: 10px;"><b th:text="${when}"></b></td>
                </tr>
                <tr>
                  <td style="vertical-align: top">What:</td>
                  <td><b th:text="${what}"></b></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td>
              <table align="center" style="width: 100%; padding-bottom: 30px" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="right" style="padding-right: 5px">
                    <a style="text-decoration:none; font-family:Gotham,
                        'Helvetica Neue', Helvetica, Arial, sans-serif; color: #777777;
                        background:#f3f3f3; border: 1px #b1b1b1 solid; border-radius: 4px; width:100px; text-align:center; line-height:40px;
                        height:40px; display:block; font-size:15px" href="#">Yes</a>
                  </td>
                  <td align="left" style="padding-left: 5px">
                    <a style="text-decoration:none; font-family:Gotham,
                        'Helvetica Neue', Helvetica, Arial, sans-serif; color: #777777;
                        background:#f3f3f3; border: 1px #b1b1b1 solid; border-radius: 4px; width:100px; text-align:center; line-height:40px;
                        height:40px; display:block; font-size:15px" href="#">No</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td>
              <a href="#" style="color: #007ee6; text-decoration:none">I'm not sure</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding-bottom: 30px; color: #444444">
        Learn more on how to <a href="#" style="color: #007ee6; text-decoration:none">protect your account</a>
      </td>
    </tr>
    <tr>
      <td style="padding-bottom: 10px; color: #444444">Thanks,</td>
    </tr>
    <tr>
      <td style="color: #444444">- The Dropbox Team</td>
    </tr>
  </table>
  <p style="width: 550px; margin: 0; padding: 10px 0; font-size: 11px; font-family:Gotham,'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #a8b9c6; text-align: end">&copy 2022 Dropbox</p>
</center>
</body>
</html>

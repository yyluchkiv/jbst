#file: noinspection SpringBootApplicationYaml

# Logging
logging:
  config: classpath:logback-console.xml

# jbst
jbst:
  email-configs:
    enabled: true
    username: "<?>"
    password: "<?>"
    from: "<?>"
  utils:
    countries-flags:
      enabled: false
    users-agents:
      enabled: false

# server
jbst-server-ops:
  server:
    base-url: "http://localhost:8973"
    credentials:
      username: "admin"
      password: "admin"
  slacks-configs:
    values:
      - team: "TECH1"
        main: true
        app-token: "<?>"
        bot-token: "<?>"
        mode: "OPERATIONAL"
        main-communication-id: "<?>"
        teams-communications:
          - team: "SMARTTRADER"
            mode: "DISABLED"
            id: "<?>"
      - team: "SMARTTRADER"
        main: false
        app-token: "<?>"
        bot-token: "<?>"
        mode: "READONLY"
        main-communication-id: "<?>"
  servers-configs:
    mode: "RESOURCES"
    rsa-keys-base-location: "~/Dropbox/Tech1/rsa-keys"
  recipients-configs:
    to:
      - "<?>"
